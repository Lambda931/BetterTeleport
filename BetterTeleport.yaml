name: Better Teleport Menu
author: LDF
punchline: An expanded Teleport Menu replacement mod 
description: |- # long description, shown when your plugin is clicked on
  Replaces the teleport menu with a new window that aims to keep the original feel, while adding new features. The new menu includes
  - Content Tracking. Zones that contain dedicated content NPCs will be displayed.
  - Content Filtering. A drop down menu is available to filter the menu by content type (e.g. Allied Societies, Custom Deliveries, Deep Dungeons).
  - "Other" tab has been removed, and its zones moved into two new tabs - "Independent Nations" and "Beyond the Source".
IconURL: https://raw.githubusercontent.com/Lambda931/BetterTeleport/main/Images/icon.png
